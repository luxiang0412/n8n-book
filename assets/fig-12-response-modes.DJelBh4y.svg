<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-label="三种响应模式：onReceived 在执行开始时回复；lastNode 等执行结束用最后节点的数据回复；responseNode 在执行中途由 Respond to Webhook 节点回复。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>三种响应模式：onReceived 在执行开始时回复；lastNode 等执行结束用最后节点的数据回复；responseNode 在执行中途由 Respond to Webhook 节点回复。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="329" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">Webhook 的三种响应模式</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">时间从左到右；橙色竖线是 HTTP 响应发出的时刻</text>
<text x="30.0" y="112.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">onReceived</text>
<rect x="150.0" y="90.0" width="110.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="205.0" y="110.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">Webhook</text>
<rect x="290.0" y="90.0" width="110.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="345.0" y="110.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">Set</text>
<rect x="430.0" y="90.0" width="110.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="485.0" y="110.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">HTTP Request</text>
<path d="M260.0,107.0 L290.0,107.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<path d="M400.0,107.0 L430.0,107.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<text x="30.0" y="192.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">lastNode</text>
<rect x="150.0" y="170.0" width="110.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="205.0" y="190.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">Webhook</text>
<rect x="290.0" y="170.0" width="110.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="345.0" y="190.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">Set</text>
<rect x="430.0" y="170.0" width="110.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="485.0" y="190.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">HTTP Request</text>
<path d="M260.0,187.0 L290.0,187.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<path d="M400.0,187.0 L430.0,187.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<text x="30.0" y="272.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">responseNode</text>
<rect x="150.0" y="250.0" width="110.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="205.0" y="270.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">Webhook</text>
<rect x="290.0" y="250.0" width="110.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="345.0" y="270.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">Set</text>
<rect x="430.0" y="250.0" width="150.0" height="34.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="505.0" y="270.3" font-size="11" text-anchor="middle" fill="#1e3a8a" font-weight="600">Respond to Webhook</text>
<rect x="610.0" y="250.0" width="110.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="665.0" y="270.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">Slack</text>
<path d="M260.0,267.0 L290.0,267.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<path d="M400.0,267.0 L430.0,267.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<path d="M580.0,267.0 L610.0,267.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<line x1="272" y1="82" x2="272" y2="132" stroke="#d97706" stroke-width="3"/>
<text x="278.0" y="78.0" font-size="11" text-anchor="start" fill="#78350f">200 {message: started}</text>
<line x1="560" y1="162" x2="560" y2="212" stroke="#d97706" stroke-width="3"/>
<text x="566.0" y="158.0" font-size="11" text-anchor="start" fill="#78350f">200 最后节点的 json</text>
<line x1="596" y1="242" x2="596" y2="292" stroke="#d97706" stroke-width="3"/>
<text x="602.0" y="238.0" font-size="11" text-anchor="start" fill="#78350f">sendResponse 钩子</text>
<text x="470.0" y="312.0" font-size="12" text-anchor="middle" fill="#6b7280">responseNode：回复之后，后面的节点照常运行</text>
</svg>
