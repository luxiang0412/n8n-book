<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-label="三种 onError：stopWorkflow 让执行失败；continueRegularOutput 把错误 item 混在正常输出里；continueErrorOutput 多出 Error 输出，错误 item 带回原始字段。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>三种 onError：stopWorkflow 让执行失败；continueRegularOutput 把错误 item 混在正常输出里；continueErrorOutput 多出 Error 输出，错误 item 带回原始字段。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="339" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">onError 的三种模式</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">输入 3 个订单，第 2 个金额为负，节点逐条处理</text>
<rect x="20.0" y="80.0" width="280.0" height="36.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="160.0" y="101.6" font-size="12" text-anchor="middle" fill="#7f1d1d" font-weight="600">stopWorkflow（默认）</text>
<rect x="20.0" y="140.0" width="90.0" height="70.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="65.0" y="172.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Validate</text>
<text x="65.0" y="187.7" font-size="10" text-anchor="middle" fill="#6b7280">#1 #2 #3</text>
<rect x="330.0" y="80.0" width="280.0" height="36.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="470.0" y="101.6" font-size="12" text-anchor="middle" fill="#78350f" font-weight="600">continueRegularOutput</text>
<rect x="330.0" y="140.0" width="90.0" height="70.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="375.0" y="172.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Validate</text>
<text x="375.0" y="187.7" font-size="10" text-anchor="middle" fill="#6b7280">#1 #2 #3</text>
<rect x="640.0" y="80.0" width="280.0" height="36.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="780.0" y="101.6" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">continueErrorOutput</text>
<rect x="640.0" y="140.0" width="90.0" height="70.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="685.0" y="172.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Validate</text>
<text x="685.0" y="187.7" font-size="10" text-anchor="middle" fill="#6b7280">#1 #2 #3</text>
<rect x="150.0" y="150.0" width="150.0" height="50.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="225.0" y="172.1" font-size="12" text-anchor="middle" fill="#7f1d1d" font-weight="600">执行失败</text>
<text x="225.0" y="187.7" font-size="10" text-anchor="middle" fill="#6b7280">status: error</text>
<path d="M110.0,175.0 L150.0,175.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-bad)"/>
<text x="160.0" y="250.0" font-size="11" text-anchor="middle" fill="#6b7280">下游都不执行</text>
<rect x="460.0" y="140.0" width="150.0" height="70.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="535.0" y="172.4" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">下游收到 3 个</text>
<text x="535.0" y="186.8" font-size="9" text-anchor="middle" fill="#6b7280">#1  {error}  #3</text>
<path d="M420.0,175.0 L460.0,175.0" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a-warn)"/>
<text x="470.0" y="250.0" font-size="11" text-anchor="middle" fill="#6b7280">错误 item 只有 error 字段</text>
<rect x="770.0" y="130.0" width="150.0" height="40.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="845.0" y="147.4" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600">Success</text>
<text x="845.0" y="161.8" font-size="9" text-anchor="middle" fill="#6b7280">#1  #3</text>
<rect x="770.0" y="190.0" width="150.0" height="40.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="845.0" y="207.4" font-size="11" text-anchor="middle" fill="#7f1d1d" font-weight="600">Error</text>
<text x="845.0" y="221.8" font-size="9" text-anchor="middle" fill="#6b7280">#2 + error</text>
<path d="M730.0,160.0 L770.0,150.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<rect x="742.8" y="139.0" width="14.4" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="750.0" y="150.5" font-size="11" text-anchor="middle" fill="#16a34a">0</text>
<path d="M730.0,190.0 L770.0,210.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-bad)"/>
<rect x="742.8" y="184.0" width="14.4" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="750.0" y="195.5" font-size="11" text-anchor="middle" fill="#dc2626">1</text>
<text x="780.0" y="260.0" font-size="11" text-anchor="middle" fill="#6b7280">按 pairedItem 合并原始字段</text>
<text x="470.0" y="310.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">节点整体抛异常且设置了继续：引擎把输入原样传给输出 0</text>
</svg>
