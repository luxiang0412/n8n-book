<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img" aria-label="Docker Compose 部署：Redis、一个 main（端口 5678，提供 /healthz、/healthz/readiness、/metrics）和两个 worker（端口 5680 提供健康检查和指标）共享一个数据卷与同一个加密密钥；docker stop 时 tini 转发 SIGTERM，进程停止接活并等待正在运行的执行。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>Docker Compose 部署：Redis、一个 main（端口 5678，提供 /healthz、/healthz/readiness、/metrics）和两个 worker（端口 5680 提供健康检查和指标）共享一个数据卷与同一个加密密钥；docker stop 时 tini 转发 SIGTERM，进程停止接活并等待正在运行的执行。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="379" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">一键部署：一个镜像，两种角色</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">docker compose up -d --build</text>
<rect x="40.0" y="160.0" width="150.0" height="70.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="115.0" y="192.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">用户 / 浏览器</text>
<text x="115.0" y="207.7" font-size="10" text-anchor="middle" fill="#6b7280">:5678</text>
<rect x="260.0" y="130.0" width="210.0" height="130.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="365.0" y="180.8" font-size="11" text-anchor="middle" fill="#1e3a8a" font-weight="600">main</text>
<text x="365.0" y="195.1" font-size="9" text-anchor="middle" fill="#6b7280">command: start</text>
<text x="365.0" y="206.8" font-size="9" text-anchor="middle" fill="#6b7280">/healthz · /healthz/readiness</text>
<text x="365.0" y="218.4" font-size="9" text-anchor="middle" fill="#6b7280">/metrics</text>
<rect x="560.0" y="60.0" width="160.0" height="60.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="640.0" y="87.5" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">redis:7-alpine</text>
<text x="640.0" y="101.8" font-size="9" text-anchor="middle" fill="#6b7280">healthcheck: ping</text>
<rect x="560.0" y="160.0" width="160.0" height="60.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="640.0" y="181.6" font-size="11" text-anchor="middle" fill="#134e4a" font-weight="600">worker × 2</text>
<text x="640.0" y="195.9" font-size="9" text-anchor="middle" fill="#6b7280">command: worker</text>
<text x="640.0" y="207.6" font-size="9" text-anchor="middle" fill="#6b7280">:5680 health · metrics</text>
<rect x="560.0" y="270.0" width="160.0" height="60.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="640.0" y="297.4" font-size="11" text-anchor="middle" fill="#9ca3af" font-weight="600">volume: data</text>
<text x="640.0" y="311.8" font-size="9" text-anchor="middle" fill="#6b7280">database.sqlite</text>
<rect x="790.0" y="60.0" width="170.0" height="110.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="875.0" y="97.2" font-size="10" text-anchor="middle" fill="#4c1d95" font-weight="600">环境变量（共享）</text>
<text x="875.0" y="110.2" font-size="8" text-anchor="middle" fill="#6b7280">ENCRYPTION_KEY</text>
<text x="875.0" y="120.6" font-size="8" text-anchor="middle" fill="#6b7280">EXECUTIONS_MODE=queue</text>
<text x="875.0" y="131.0" font-size="8" text-anchor="middle" fill="#6b7280">REDIS_URL</text>
<text x="875.0" y="141.4" font-size="8" text-anchor="middle" fill="#6b7280">METRICS=true</text>
<rect x="790.0" y="200.0" width="170.0" height="130.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="875.0" y="242.0" font-size="10" text-anchor="middle" fill="#14532d" font-weight="600">docker stop</text>
<text x="875.0" y="255.0" font-size="8" text-anchor="middle" fill="#6b7280">tini → SIGTERM</text>
<text x="875.0" y="265.4" font-size="8" text-anchor="middle" fill="#6b7280">readiness → 503</text>
<text x="875.0" y="275.8" font-size="8" text-anchor="middle" fill="#6b7280">停止触发器</text>
<text x="875.0" y="286.2" font-size="8" text-anchor="middle" fill="#6b7280">等运行中的执行 ≤ 30 s</text>
<text x="875.0" y="296.6" font-size="8" text-anchor="middle" fill="#6b7280">stop_grace_period 40 s</text>
<path d="M190.0,195.0 L260.0,195.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M470.0,160.0 L560.0,95.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M470.0,195.0 L560.0,190.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M470.0,230.0 L560.0,295.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M640.0,160.0 L640.0,120.0" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a-warn)"/>
<path d="M640.0,220.0 L640.0,270.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<text x="490.0" y="365.0" font-size="11" text-anchor="middle" fill="#6b7280">depends_on: worker 等 main 健康（main 先建表），main 等 redis 健康</text>
</svg>
