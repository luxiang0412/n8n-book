<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-label="Tools Agent 循环：第一轮模型请求工具，Agent 返回 EngineRequest 由引擎执行工具；引擎带着 EngineResponse 恢复 Agent，Agent 把调用和结果拼进 scratchpad，第二轮模型给出最终回答并写入记忆。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>Tools Agent 循环：第一轮模型请求工具，Agent 返回 EngineRequest 由引擎执行工具；引擎带着 EngineResponse 恢复 Agent，Agent 把调用和结果拼进 scratchpad，第二轮模型给出最终回答并写入记忆。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="379" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">Tools Agent 的一次循环</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">Agent.execute() 被调用两次；状态保存在 EngineRequest.metadata 里</text>
<rect x="30.0" y="90.0" width="220.0" height="120.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="140.0" y="134.1" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600">① Agent.execute()</text>
<text x="140.0" y="149.7" font-size="10" text-anchor="middle" fill="#6b7280">messages = system</text>
<text x="140.0" y="162.7" font-size="10" text-anchor="middle" fill="#6b7280">+ 记忆历史 + user</text>
<text x="140.0" y="175.7" font-size="10" text-anchor="middle" fill="#6b7280">+ scratchpad(空)</text>
<rect x="320.0" y="90.0" width="170.0" height="60.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="405.0" y="117.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">模型</text>
<text x="405.0" y="132.7" font-size="10" text-anchor="middle" fill="#6b7280">toolCalls: Calculator</text>
<rect x="560.0" y="90.0" width="160.0" height="60.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="640.0" y="117.1" font-size="12" text-anchor="middle" fill="#78350f" font-weight="600">EngineRequest</text>
<text x="640.0" y="132.7" font-size="10" text-anchor="middle" fill="#6b7280">actions + metadata</text>
<rect x="780.0" y="90.0" width="140.0" height="60.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="850.0" y="117.1" font-size="12" text-anchor="middle" fill="#134e4a" font-weight="600">引擎执行</text>
<text x="850.0" y="132.7" font-size="10" text-anchor="middle" fill="#6b7280">Calculator 节点</text>
<path d="M250.0,120.0 L320.0,120.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="261.9" y="104.0" width="46.3" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="285.0" y="115.5" font-size="11" text-anchor="middle" fill="#64748b">invoke</text>
<path d="M490.0,120.0 L560.0,120.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="501.9" y="104.0" width="46.3" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="525.0" y="115.5" font-size="11" text-anchor="middle" fill="#64748b">return</text>
<path d="M720.0,120.0 L780.0,120.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="30.0" y="250.0" width="220.0" height="100.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="140.0" y="290.6" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600">② Agent.execute(response)</text>
<text x="140.0" y="306.2" font-size="10" text-anchor="middle" fill="#6b7280">scratchpad = buildSteps()</text>
<text x="140.0" y="319.2" font-size="10" text-anchor="middle" fill="#6b7280">= [调用 + 结果 &quot;87&quot;]</text>
<rect x="320.0" y="260.0" width="170.0" height="60.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="405.0" y="287.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">模型</text>
<text x="405.0" y="302.7" font-size="10" text-anchor="middle" fill="#6b7280">content: &quot;...87.&quot;</text>
<rect x="560.0" y="260.0" width="160.0" height="60.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="640.0" y="287.1" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">最终输出</text>
<text x="640.0" y="302.7" font-size="10" text-anchor="middle" fill="#6b7280">{ output }</text>
<rect x="780.0" y="260.0" width="140.0" height="60.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="850.0" y="287.1" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="600">Simple Memory</text>
<text x="850.0" y="302.7" font-size="10" text-anchor="middle" fill="#6b7280">saveContext()</text>
<path d="M850.0,150.0 L850.0,200.0 L140.0,200.0 L140.0,250.0" fill="none" stroke="#0d9488" stroke-width="1.6" marker-end="url(#a-teal)"/>
<rect x="378.2" y="184.0" width="233.5" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="495.0" y="195.5" font-size="11" text-anchor="middle" fill="#0d9488">EngineResponse（工具结果 + metadata）</text>
<path d="M250.0,290.0 L320.0,290.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="261.9" y="274.0" width="46.3" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="285.0" y="285.5" font-size="11" text-anchor="middle" fill="#64748b">invoke</text>
<path d="M490.0,290.0 L560.0,290.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M720.0,290.0 L780.0,290.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<text x="470.0" y="368.0" font-size="11" text-anchor="middle" fill="#6b7280">iterationCount ≥ maxIterations 时报错；多个工具调用放进同一个 EngineRequest</text>
</svg>
