<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="引擎只调用钩子；不同场景挂不同的处理函数组：regular main 保存并推送，worker 保存并经 Redis 转发，CLI 打印。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
