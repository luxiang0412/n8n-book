<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="RAG 的两条流水线：写入时把条目切块、向量化后存入向量库；提问时 Agent 把问题交给检索工具，工具把问题向量化，用余弦相似度取前 k 块，作为工具结果交给模型生成回答。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>RAG 的两条流水线：写入时把条目切块、向量化后存入向量库；提问时 Agent 把问题交给检索工具，工具把问题向量化，用余弦相似度取前 k 块，作为工具结果交给模型生成回答。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="399" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">RAG：先写入，再检索</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">两个工作流共享同一个 Memory Key</text>
<rect x="20.0" y="70.0" width="920.0" height="130.0" rx="12" fill="none" stroke="#0d9488" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="88.0" font-size="12" text-anchor="start" fill="#0d9488" font-weight="600">写入工作流（Insert Documents）</text>
<rect x="40.0" y="110.0" width="125.0" height="60.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="102.5" y="137.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Code / HTTP</text>
<text x="102.5" y="152.7" font-size="10" text-anchor="middle" fill="#6b7280">3 个条目</text>
<rect x="225.0" y="110.0" width="125.0" height="60.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="287.5" y="137.1" font-size="12" text-anchor="middle" fill="#134e4a" font-weight="600">Data Loader</text>
<text x="287.5" y="152.7" font-size="10" text-anchor="middle" fill="#6b7280">切块 + 元数据</text>
<rect x="410.0" y="110.0" width="125.0" height="60.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="472.5" y="137.1" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="600">Embeddings</text>
<text x="472.5" y="152.7" font-size="10" text-anchor="middle" fill="#6b7280">embedDocuments()</text>
<rect x="595.0" y="110.0" width="125.0" height="60.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="657.5" y="137.1" font-size="12" text-anchor="middle" fill="#78350f" font-weight="600">向量库</text>
<text x="657.5" y="152.7" font-size="10" text-anchor="middle" fill="#6b7280">key = kb</text>
<rect x="780.0" y="110.0" width="125.0" height="60.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="842.5" y="137.1" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">输出</text>
<text x="842.5" y="152.7" font-size="10" text-anchor="middle" fill="#6b7280">3 个块</text>
<path d="M165.0,140.0 L225.0,140.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M350.0,140.0 L410.0,140.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="359.5" y="124.0" width="41.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="380.0" y="135.5" font-size="11" text-anchor="middle" fill="#64748b">文本块</text>
<path d="M535.0,140.0 L595.0,140.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="550.0" y="124.0" width="30.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="565.0" y="135.5" font-size="11" text-anchor="middle" fill="#64748b">向量</text>
<path d="M720.0,140.0 L780.0,140.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="20.0" y="230.0" width="920.0" height="140.0" rx="12" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="248.0" font-size="12" text-anchor="start" fill="#2563eb" font-weight="600">提问工作流（Retrieve as Tool）</text>
<rect x="40.0" y="270.0" width="125.0" height="60.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="102.5" y="297.1" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600">AI Agent</text>
<text x="102.5" y="312.7" font-size="10" text-anchor="middle" fill="#6b7280">调用工具</text>
<rect x="225.0" y="270.0" width="125.0" height="60.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="287.5" y="297.1" font-size="12" text-anchor="middle" fill="#134e4a" font-weight="600">检索工具</text>
<text x="287.5" y="312.7" font-size="10" text-anchor="middle" fill="#6b7280">{ query }</text>
<rect x="410.0" y="270.0" width="125.0" height="60.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="472.5" y="297.1" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="600">Embeddings</text>
<text x="472.5" y="312.7" font-size="10" text-anchor="middle" fill="#6b7280">embedQuery()</text>
<rect x="595.0" y="270.0" width="125.0" height="60.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="657.5" y="297.1" font-size="12" text-anchor="middle" fill="#78350f" font-weight="600">余弦相似度</text>
<text x="657.5" y="312.7" font-size="10" text-anchor="middle" fill="#6b7280">取前 k 块</text>
<rect x="780.0" y="270.0" width="125.0" height="60.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="842.5" y="297.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">模型</text>
<text x="842.5" y="312.7" font-size="10" text-anchor="middle" fill="#6b7280">依据块作答</text>
<path d="M165.0,300.0 L225.0,300.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M350.0,300.0 L410.0,300.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="365.0" y="284.0" width="30.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="380.0" y="295.5" font-size="11" text-anchor="middle" fill="#64748b">问题</text>
<path d="M535.0,300.0 L595.0,300.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="539.0" y="284.0" width="52.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="565.0" y="295.5" font-size="11" text-anchor="middle" fill="#64748b">问题向量</text>
<path d="M720.0,300.0 L780.0,300.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="724.0" y="284.0" width="52.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="750.0" y="295.5" font-size="11" text-anchor="middle" fill="#64748b">工具结果</text>
<path d="M657.0,270.0 L657.0,170.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-muted)"/>
<rect x="665.5" y="204.0" width="63.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="697.0" y="215.5" font-size="11" text-anchor="middle" fill="#6b7280">查同一个库</text>
<text x="480.0" y="392.0" font-size="11" text-anchor="middle" fill="#6b7280">写入和检索必须用同一个 Embeddings 模型：向量只能和同一模型产生的向量比较</text>
</svg>
