<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-label="工作流 JSON 由 nodes 和按源节点索引的 connections 组成；Workflow 构造时生成反向索引；节点输出是 输出×item 的二维数组，item 用 pairedItem 记录来源。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
