7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="429" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">数据模型：节点、连接与 items</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">保存的 JSON → 运行时的两种索引 → If 节点的一次输出</text>
<rect x="20.0" y="70.0" width="280.0" height="340.0" rx="12" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="88.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="600">工作流 JSON（保存）</text>
<text x="36.0" y="102.0" font-size="11" text-anchor="start" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">{ &quot;nodes&quot;: [</text>
<text x="36.0" y="128.0" font-size="11" text-anchor="start" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">   { &quot;name&quot;: &quot;Orders&quot;, ... },</text>
<text x="36.0" y="154.0" font-size="11" text-anchor="start" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">   { &quot;name&quot;: &quot;Big order?&quot;,</text>
<text x="36.0" y="180.0" font-size="11" text-anchor="start" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">     &quot;type&quot;: &quot;n8n-nodes-base.if&quot;,</text>
<text x="36.0" y="206.0" font-size="11" text-anchor="start" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">     &quot;position&quot;: [440, 0],</text>
<text x="36.0" y="232.0" font-size="11" text-anchor="start" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">     &quot;parameters&quot;: {...} }, ...],</text>
<text x="36.0" y="258.0" font-size="11" text-anchor="start" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">  &quot;connections&quot;: {</text>
<text x="36.0" y="284.0" font-size="11" text-anchor="start" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">   &quot;Big order?&quot;: { &quot;main&quot;: [</text>
<text x="36.0" y="310.0" font-size="11" text-anchor="start" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">     [{node:&quot;VIP&quot;, index:0}],</text>
<text x="36.0" y="336.0" font-size="11" text-anchor="start" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">     [{node:&quot;Normal&quot;,index:0}]</text>
<text x="36.0" y="362.0" font-size="11" text-anchor="start" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">   ]}, ... } }</text>
<rect x="320.0" y="70.0" width="280.0" height="340.0" rx="12" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="332.0" y="88.0" font-size="12" text-anchor="start" fill="#2563eb" font-weight="600">两种索引（运行时）</text>
<rect x="340.0" y="104.0" width="240.0" height="60.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="460.0" y="131.1" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600">connectionsBySourceNode</text>
<text x="460.0" y="146.7" font-size="10" text-anchor="middle" fill="#6b7280">源 → 类型 → 输出号 → [目标]</text>
<rect x="340.0" y="214.0" width="240.0" height="60.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="460.0" y="241.1" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="600">connectionsByDestinationNode</text>
<text x="460.0" y="256.7" font-size="10" text-anchor="middle" fill="#6b7280">目标 → 类型 → 输入号 → [源]</text>
<path d="M460.0,164.0 L460.0,214.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)"/>
<rect x="377.7" y="184.0" width="164.6" height="14" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="460.0" y="194.5" font-size="10" text-anchor="middle" fill="#7c3aed">mapConnectionsByDestination</text>
<text x="460.0" y="310.0" font-size="11" text-anchor="middle" fill="#6b7280">正向：执行时找下游（O(1)）</text>
<text x="460.0" y="332.0" font-size="11" text-anchor="middle" fill="#6b7280">反向：找 Merge 的输入、找祖先</text>
<text x="460.0" y="354.0" font-size="11" text-anchor="middle" fill="#6b7280">type: main / ai_tool / ai_languageModel…</text>
<rect x="620.0" y="70.0" width="300.0" height="340.0" rx="12" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="632.0" y="88.0" font-size="12" text-anchor="start" fill="#16a34a" font-weight="600">If 节点的输出 INodeExecutionData[][]</text>
<text x="640.0" y="108.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="600">输出 0（true）</text>
<rect x="640.0" y="118.0" width="260.0" height="40.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="770.0" y="135.4" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">{ json: Ada 120 }</text>
<text x="770.0" y="149.8" font-size="9" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">pairedItem: { item: 0 }</text>
<rect x="640.0" y="166.0" width="260.0" height="40.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="770.0" y="183.4" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">{ json: Grace 560 }</text>
<text x="770.0" y="197.8" font-size="9" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">pairedItem: { item: 2 }</text>
<text x="640.0" y="236.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="600">输出 1（false）</text>
<rect x="640.0" y="246.0" width="260.0" height="40.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="770.0" y="263.4" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">{ json: Linus 35 }</text>
<text x="770.0" y="277.8" font-size="9" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">pairedItem: { item: 1 }</text>
<text x="770.0" y="320.0" font-size="11" text-anchor="middle" fill="#6b7280">空输出 → 下游节点不执行</text>
<text x="770.0" y="342.0" font-size="11" text-anchor="middle" fill="#6b7280">pairedItem.item = 输入里的下标</text>
</svg>
