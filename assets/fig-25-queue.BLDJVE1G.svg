<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-label="队列模式：main 接收 Webhook，把执行数据写入数据库，只把执行 ID 放进 Redis 队列；worker 用 BLMOVE 取任务，从数据库读数据、运行、写回结果，通过 pub/sub 把 Webhook 响应、流式块和 job-finished 发回 main；main 再回复 HTTP 请求。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>队列模式：main 接收 Webhook，把执行数据写入数据库，只把执行 ID 放进 Redis 队列；worker 用 BLMOVE 取任务，从数据库读数据、运行、写回结果，通过 pub/sub 把 Webhook 响应、流式块和 job-finished 发回 main；main 再回复 HTTP 请求。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="399" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">队列模式：main 接活，worker 干活</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">队列里只有 ID；数据在共享的数据库里</text>
<rect x="20.0" y="170.0" width="120.0" height="60.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="80.0" y="197.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">HTTP 客户端</text>
<text x="80.0" y="212.7" font-size="10" text-anchor="middle" fill="#6b7280">Webhook 调用</text>
<rect x="200.0" y="150.0" width="190.0" height="100.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="295.0" y="184.1" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600">main</text>
<text x="295.0" y="199.7" font-size="10" text-anchor="middle" fill="#6b7280">编辑器 · API · Webhook</text>
<text x="295.0" y="212.7" font-size="10" text-anchor="middle" fill="#6b7280">触发器 · WaitTracker</text>
<text x="295.0" y="225.7" font-size="10" text-anchor="middle" fill="#6b7280">手动执行在这里跑</text>
<rect x="470.0" y="80.0" width="170.0" height="70.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="555.0" y="106.6" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">Redis</text>
<text x="555.0" y="120.9" font-size="9" text-anchor="middle" fill="#6b7280">list: mini-n8n:jobs</text>
<text x="555.0" y="132.6" font-size="9" text-anchor="middle" fill="#6b7280">channel: job-messages</text>
<rect x="470.0" y="280.0" width="170.0" height="60.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="555.0" y="307.1" font-size="12" text-anchor="middle" fill="#9ca3af" font-weight="600">数据库</text>
<text x="555.0" y="322.7" font-size="10" text-anchor="middle" fill="#6b7280">执行数据 · 结果</text>
<rect x="720.0" y="90.0" width="200.0" height="70.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="820.0" y="116.6" font-size="11" text-anchor="middle" fill="#134e4a" font-weight="600">worker A</text>
<text x="820.0" y="130.9" font-size="9" text-anchor="middle" fill="#6b7280">concurrency 5</text>
<text x="820.0" y="142.6" font-size="9" text-anchor="middle" fill="#6b7280">Task Runner 子进程</text>
<rect x="720.0" y="200.0" width="200.0" height="70.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="820.0" y="226.6" font-size="11" text-anchor="middle" fill="#134e4a" font-weight="600">worker B</text>
<text x="820.0" y="240.9" font-size="9" text-anchor="middle" fill="#6b7280">concurrency 5</text>
<text x="820.0" y="252.6" font-size="9" text-anchor="middle" fill="#6b7280">Task Runner 子进程</text>
<path d="M140.0,200.0 L200.0,200.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="155.0" y="184.0" width="30.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="170.0" y="195.5" font-size="11" text-anchor="middle" fill="#64748b">请求</text>
<path d="M390.0,170.0 L470.0,115.0" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a-warn)"/>
<rect x="349.0" y="126.5" width="142.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="420.0" y="138.0" font-size="11" text-anchor="middle" fill="#d97706">① LPUSH {executionId}</text>
<path d="M390.0,230.0 L470.0,300.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<rect x="366.6" y="269.0" width="86.8" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="410.0" y="280.5" font-size="11" text-anchor="middle" fill="#6b7280">② 先写执行数据</text>
<path d="M640.0,105.0 L720.0,115.0" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a-warn)"/>
<rect x="650.5" y="94.0" width="59.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="680.0" y="105.5" font-size="11" text-anchor="middle" fill="#d97706">③ BLMOVE</text>
<path d="M640.0,130.0 L720.0,225.0" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a-warn)"/>
<path d="M760.0,270.0 L640.0,310.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<rect x="657.0" y="296.0" width="105.9" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="710.0" y="307.5" font-size="11" text-anchor="middle" fill="#6b7280">④ 读数据 / 写结果</text>
<path d="M720.0,150.0 L680.0,190.0 L390.0,190.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)"/>
<rect x="415.6" y="196.0" width="212.2" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="521.7" y="207.5" font-size="11" text-anchor="middle" fill="#7c3aed">⑤ respond / chunk / job-finished</text>
<path d="M200.0,215.0 L140.0,215.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<rect x="148.6" y="221.0" width="42.8" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="170.0" y="232.5" font-size="11" text-anchor="middle" fill="#16a34a">⑥ 回复</text>
<text x="490.0" y="385.0" font-size="11" text-anchor="middle" fill="#6b7280">SQLite 只适合单机（共享卷 + busy_timeout）；n8n 在队列模式下建议 PostgreSQL</text>
</svg>
