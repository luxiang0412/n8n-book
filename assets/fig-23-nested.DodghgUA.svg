<text x="296.0" y="131.3" font-size="11" text-anchor="middle" fill="#134e4a" font-weight="600">Research</text>
<rect x="218.0" y="152.0" width="156.0" height="32.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="296.0" y="171.3" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">AI Agent（resume）</text>
<text x="208.0" y="272.0" font-size="11" text-anchor="start" fill="#6b7280">Research 也是 Agent</text>
<text x="396.0" y="88.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700">③ Research 返回请求</text>
<rect x="396.0" y="98.0" width="176.0" height="150.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="406.0" y="112.0" width="156.0" height="32.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="484.0" y="131.3" font-size="11" text-anchor="middle" fill="#134e4a" font-weight="600">Calculator</text>
<rect x="406.0" y="152.0" width="156.0" height="32.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="484.0" y="171.3" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">Research（resume）</text>
<rect x="406.0" y="192.0" width="156.0" height="32.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="484.0" y="211.3" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">AI Agent（resume）</text>
<text x="396.0" y="272.0" font-size="11" text-anchor="start" fill="#6b7280">返回请求：Calculator</text>
<text x="584.0" y="88.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700">④ Calculator 完成</text>
<rect x="584.0" y="98.0" width="176.0" height="150.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="594.0" y="112.0" width="156.0" height="32.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="672.0" y="131.3" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">Research（resume）</text>
<rect x="594.0" y="152.0" width="156.0" height="32.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="672.0" y="171.3" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">AI Agent（resume）</text>
<text x="584.0" y="272.0" font-size="11" text-anchor="start" fill="#6b7280">Research 得到 42</text>
<text x="772.0" y="88.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700">⑤ Research 完成</text>
<rect x="772.0" y="98.0" width="176.0" height="150.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="782.0" y="112.0" width="156.0" height="32.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="860.0" y="131.3" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">AI Agent（resume）</text>
<text x="772.0" y="272.0" font-size="11" text-anchor="start" fill="#6b7280">Agent 得到 Research 的回答</text>
<text x="480.0" y="318.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">运行次数：AI Agent 1 · Boss Model 2 · Research 1 · Research Model 2 · Calculator 1</text>
<text x="480.0" y="346.0" font-size="11" text-anchor="middle" fill="#6b7280">Research 的“运行”包含两次 execute() 调用；嵌套深度只受 maxIterations 和栈内存限制</text>
</svg>
