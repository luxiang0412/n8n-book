<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="表达式求值三阶段：拆分模板、AST 检查与改写、在只含数据代理变量的作用域中执行；单个代码块保留类型。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>表达式求值三阶段：拆分模板、AST 检查与改写、在只含数据代理变量的作用域中执行；单个代码块保留类型。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="299" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">表达式求值的三个阶段</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">&quot;=Hi {{ $json.name }}, {{ $json[key] }}&quot;</text>
<rect x="20.0" y="100.0" width="200.0" height="90.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="120.0" y="122.6" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">① 拆分</text>
<text x="120.0" y="138.2" font-size="10" text-anchor="middle" fill="#6b7280">文本: &quot;Hi &quot;</text>
<text x="120.0" y="151.2" font-size="10" text-anchor="middle" fill="#6b7280">代码: $json.name</text>
<text x="120.0" y="164.2" font-size="10" text-anchor="middle" fill="#6b7280">文本: &quot;, &quot;</text>
<text x="120.0" y="177.2" font-size="10" text-anchor="middle" fill="#6b7280">代码: $json[key]</text>
<rect x="270.0" y="100.0" width="240.0" height="90.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="390.0" y="129.1" font-size="12" text-anchor="middle" fill="#78350f" font-weight="600">② AST 检查 / 改写</text>
<text x="390.0" y="144.7" font-size="10" text-anchor="middle" fill="#6b7280">$x.constructor → 报错</text>
<text x="390.0" y="157.7" font-size="10" text-anchor="middle" fill="#6b7280">$json[key] →</text>
<text x="390.0" y="170.7" font-size="10" text-anchor="middle" fill="#6b7280">$json[__sanitize(key)]</text>
<rect x="560.0" y="100.0" width="200.0" height="90.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="660.0" y="136.6" font-size="11" text-anchor="middle" fill="#1e3a8a" font-weight="600">③ 受限作用域执行</text>
<text x="660.0" y="150.9" font-size="9" text-anchor="middle" fill="#6b7280">只看得到 $json $input $()</text>
<text x="660.0" y="162.6" font-size="9" text-anchor="middle" fill="#6b7280">process / require → undefined</text>
<rect x="800.0" y="100.0" width="120.0" height="90.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="860.0" y="136.6" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600">结果</text>
<text x="860.0" y="150.9" font-size="9" text-anchor="middle" fill="#6b7280">1 个代码块：原类型</text>
<text x="860.0" y="162.6" font-size="9" text-anchor="middle" fill="#6b7280">否则：拼字符串</text>
<path d="M220.0,145.0 L270.0,145.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M510.0,145.0 L560.0,145.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M760.0,145.0 L800.0,145.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<text x="390.0" y="230.0" font-size="11" text-anchor="middle" fill="#6b7280">n8n：@n8n/tournament + PrototypeSanitizer 等钩子</text>
<text x="660.0" y="230.0" font-size="11" text-anchor="middle" fill="#6b7280">n8n 默认：isolated-vm 中执行</text>
<text x="390.0" y="252.0" font-size="11" text-anchor="middle" fill="#6b7280">mini-n8n：acorn + 同样的黑名单</text>
<text x="660.0" y="252.0" font-size="11" text-anchor="middle" fill="#6b7280">mini-n8n：with + Proxy 白名单</text>
</svg>
