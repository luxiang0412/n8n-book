<text x="105.0" y="260.9" font-size="9" text-anchor="middle" fill="#6b7280">httpRequestWithAuthentication</text>
<text x="105.0" y="272.6" font-size="9" text-anchor="middle" fill="#6b7280">(&#x27;httpHeaderAuth&#x27;, opts)</text>
<rect x="250.0" y="220.0" width="190.0" height="70.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
