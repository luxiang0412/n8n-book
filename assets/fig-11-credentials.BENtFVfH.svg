<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-label="凭证路径：保存时加密，读取时把密码替换为占位符，执行时服务端解密并按凭证类型的 authenticate 规则改写请求；节点只声明凭证类型。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>凭证路径：保存时加密，读取时把密码替换为占位符，执行时服务端解密并按凭证类型的 authenticate 规则改写请求；节点只声明凭证类型。</title>
