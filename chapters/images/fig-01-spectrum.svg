<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="从确定性工作流到自主 Agent：越往右，控制权越多地交给模型；n8n 在同一张画布上覆盖全部五种形态。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>从确定性工作流到自主 Agent：越往右，控制权越多地交给模型；n8n 在同一张画布上覆盖全部五种形态。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">Workflow ↔ Agent 光谱</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">谁决定下一步做什么？</text>
<rect x="30.0" y="100.0" width="150.0" height="70.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="105.0" y="131.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">① 触发→动作</text>
<text x="105.0" y="148.7" font-size="11" text-anchor="middle" fill="#6b7280">一条直线</text>
<text x="105.0" y="196.0" font-size="11" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">Webhook → HTTP</text>
<rect x="205.0" y="100.0" width="150.0" height="70.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="280.0" y="131.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">② 分支/合并/循环</text>
<text x="280.0" y="148.7" font-size="11" text-anchor="middle" fill="#6b7280">人画好的图</text>
<text x="280.0" y="196.0" font-size="11" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">If · Merge · Loop</text>
<rect x="380.0" y="100.0" width="150.0" height="70.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="455.0" y="131.8" font-size="13" text-anchor="middle" fill="#134e4a" font-weight="600">③ LLM Chain</text>
<text x="455.0" y="148.7" font-size="11" text-anchor="middle" fill="#6b7280">步骤里调模型</text>
<text x="455.0" y="196.0" font-size="11" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">Basic LLM Chain</text>
<rect x="555.0" y="100.0" width="150.0" height="70.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="630.0" y="131.8" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="600">④ 工作流中的 Agent</text>
<text x="630.0" y="148.7" font-size="11" text-anchor="middle" fill="#6b7280">模型选工具</text>
<text x="630.0" y="196.0" font-size="11" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">AI Agent + Tools</text>
<rect x="730.0" y="100.0" width="150.0" height="70.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="805.0" y="131.8" font-size="13" text-anchor="middle" fill="#4c1d95" font-weight="600">⑤ 多 Agent / HITL</text>
<text x="805.0" y="148.7" font-size="11" text-anchor="middle" fill="#6b7280">Agent 调 Agent</text>
<text x="805.0" y="196.0" font-size="11" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">Agent Tool · 审批</text>
<path d="M180.0,135.0 L205.0,135.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M355.0,135.0 L380.0,135.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M530.0,135.0 L555.0,135.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M705.0,135.0 L730.0,135.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M40.0,240.0 L870.0,240.0" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/>
<text x="40.0" y="262.0" font-size="12" text-anchor="start" fill="#6b7280">人决定路径：可预测、可审计、便宜</text>
<text x="870.0" y="262.0" font-size="12" text-anchor="end" fill="#6b7280">模型决定路径：灵活、难预测、更贵</text>
<text x="450.0" y="300.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">n8n 的选择：Agent 只是图里的一个节点，外层仍是确定性工作流</text>
</svg>
