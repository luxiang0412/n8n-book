<text x="390.0" y="225.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Schedule Trigger</text>
<text x="390.0" y="240.7" font-size="10" text-anchor="middle" fill="#6b7280">trigger()</text>
<rect x="560.0" y="70.0" width="170.0" height="56.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="645.0" y="95.1" font-size="12" text-anchor="middle" fill="#78350f" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">webhook_entity</text>
<text x="645.0" y="110.7" font-size="10" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">(orders, POST)</text>
<rect x="560.0" y="200.0" width="170.0" height="56.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="645.0" y="225.4" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">ScheduledTaskManager</text>
<text x="645.0" y="239.8" font-size="9" text-anchor="middle" fill="#6b7280">cron */2 * * * * *</text>
<rect x="780.0" y="130.0" width="130.0" height="70.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="845.0" y="162.1" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">新执行</text>
<text x="845.0" y="177.7" font-size="10" text-anchor="middle" fill="#6b7280">triggerToStartFrom</text>
