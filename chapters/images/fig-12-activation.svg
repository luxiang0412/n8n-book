<text x="525.0" y="93.5" font-size="11" text-anchor="middle" fill="#64748b">insert</text>
<path d="M490.0,228.0 L560.0,228.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="482.7" y="212.0" width="84.6" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="525.0" y="223.5" font-size="11" text-anchor="middle" fill="#64748b">registerCron</text>
<path d="M730.0,98.0 L780.0,150.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
