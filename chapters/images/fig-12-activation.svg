<path d="M730.0,228.0 L780.0,182.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<rect x="738.2" y="189.0" width="33.5" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
