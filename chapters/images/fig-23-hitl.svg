<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-label="人工审批跨两段执行：第一段里 Agent 请求被保护的工具，引擎运行 Human Approval，它保存一次性令牌、调用 putExecutionToWait，执行以 waiting 状态存入数据库；审批人打开链接后，服务器校验令牌、写入决定，从数据库恢复执行；Human Approval 再次运行并请求真正的工具，结果交回 Agent。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>人工审批跨两段执行：第一段里 Agent 请求被保护的工具，引擎运行 Human Approval，它保存一次性令牌、调用 putExecutionToWait，执行以 waiting 状态存入数据库；审批人打开链接后，服务器校验令牌、写入决定，从数据库恢复执行；Human Approval 再次运行并请求真正的工具，结果交回 Agent。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="419" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">人工审批：执行停下，等人，再继续</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">两段执行之间，所有状态都在数据库里的 IRunExecutionData</text>
<text x="20.0" y="104.0" font-size="11" text-anchor="start" fill="#1f2937" font-weight="600">AI Agent</text>
<line x1="150" y1="100" x2="960" y2="100" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20.0" y="164.0" font-size="11" text-anchor="start" fill="#1f2937" font-weight="600">Human Approval</text>
<line x1="150" y1="160" x2="960" y2="160" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20.0" y="224.0" font-size="11" text-anchor="start" fill="#1f2937" font-weight="600">Refund（被保护）</text>
<line x1="150" y1="220" x2="960" y2="220" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20.0" y="284.0" font-size="11" text-anchor="start" fill="#1f2937" font-weight="600">数据库</text>
<line x1="150" y1="280" x2="960" y2="280" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20.0" y="344.0" font-size="11" text-anchor="start" fill="#1f2937" font-weight="600">审批人 / 服务器</text>
<line x1="150" y1="340" x2="960" y2="340" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="160.0" y="86.0" width="120.0" height="28.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="220.0" y="103.3" font-size="11" text-anchor="middle" fill="#1e3a8a" font-weight="600">请求工具</text>
<path d="M220.0,114.0 L220.0,146.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-accent)"/>
<rect x="230.0" y="146.0" width="150.0" height="28.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="305.0" y="163.3" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">存令牌 · 等待</text>
<path d="M305.0,174.0 L305.0,266.0" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a-warn)"/>
<rect x="300.0" y="227.0" width="110.1" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="355.0" y="238.5" font-size="11" text-anchor="middle" fill="#d97706">status = waiting</text>
<rect x="260.0" y="266.0" width="110.0" height="28.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="315.0" y="283.3" font-size="11" text-anchor="middle" fill="#9ca3af" font-weight="600">执行已保存</text>
<rect x="400.0" y="76.0" width="120.0" height="290.0" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="460.0" y="230.0" font-size="11" text-anchor="middle" fill="#6b7280">……几分钟</text>
<text x="460.0" y="248.0" font-size="11" text-anchor="middle" fill="#6b7280">或几天……</text>
<rect x="540.0" y="326.0" width="170.0" height="28.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="625.0" y="343.3" font-size="11" text-anchor="middle" fill="#4c1d95" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">GET …?token&amp;decision</text>
<path d="M600.0,326.0 L600.0,294.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)"/>
<rect x="608.0" y="294.0" width="52.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="634.0" y="305.5" font-size="11" text-anchor="middle" fill="#7c3aed">校验令牌</text>
<rect x="550.0" y="266.0" width="140.0" height="28.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="620.0" y="283.3" font-size="11" text-anchor="middle" fill="#9ca3af" font-weight="600">写入决定 · 恢复</text>
<path d="M650.0,266.0 L650.0,174.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="610.0" y="146.0" width="140.0" height="28.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="680.0" y="163.3" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">再次运行：批准</text>
<path d="M750.0,160.0 L780.0,206.0" fill="none" stroke="#0d9488" stroke-width="1.6" marker-end="url(#a-teal)"/>
<rect x="739.5" y="167.0" width="90.9" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="785.0" y="178.5" font-size="11" text-anchor="middle" fill="#0d9488">EngineRequest</text>
<rect x="770.0" y="206.0" width="100.0" height="28.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="820.0" y="223.3" font-size="11" text-anchor="middle" fill="#134e4a" font-weight="600">执行退款</text>
<path d="M870.0,206.0 L900.0,114.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<rect x="888.0" y="144.0" width="30.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="903.0" y="155.5" font-size="11" text-anchor="middle" fill="#16a34a">结果</text>
<text x="880.0" y="252.0" font-size="10" text-anchor="middle" fill="#6b7280">（经 Human Approval 交回）</text>
<rect x="860.0" y="86.0" width="100.0" height="28.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="910.0" y="103.3" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600">最终回答</text>
<text x="490.0" y="404.0" font-size="11" text-anchor="middle" fill="#6b7280">拒绝时：Human Approval 不发请求，直接告诉 Agent “人类拒绝了这次调用”</text>
</svg>
