<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="同一个 Simple Vector Store 节点的三种模式：Insert 有主输入、Embedding 和 Document 子输入，输出主数据；Get Many 有主输入和 Embedding，输出匹配的块；Retrieve as Tool 只有 Embedding 输入，输出 ai_tool 连到 Agent。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>同一个 Simple Vector Store 节点的三种模式：Insert 有主输入、Embedding 和 Document 子输入，输出主数据；Get Many 有主输入和 Embedding，输出匹配的块；Retrieve as Tool 只有 Embedding 输入，输出 ai_tool 连到 Agent。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="329" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">一个节点，三种模式：端口由参数决定</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">inputs / outputs 是以 $parameter 求值的表达式</text>
<rect x="40.0" y="90.0" width="260.0" height="70.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="170.0" y="121.8" font-size="13" text-anchor="middle" fill="#78350f" font-weight="600">Simple Vector Store</text>
<text x="170.0" y="138.7" font-size="11" text-anchor="middle" fill="#6b7280">mode = Insert Documents</text>
<rect x="40.0" y="200.0" width="82.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="81.0" y="220.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">main</text>
<path d="M81.0,200.0 L81.0,160.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="128.0" y="200.0" width="82.0" height="34.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="169.0" y="220.3" font-size="11" text-anchor="middle" fill="#4c1d95" font-weight="600">Embedding*</text>
<path d="M169.0,200.0 L169.0,160.0" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>
<rect x="216.0" y="200.0" width="82.0" height="34.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="257.0" y="220.3" font-size="11" text-anchor="middle" fill="#4c1d95" font-weight="600">Document*</text>
<path d="M257.0,200.0 L257.0,160.0" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>
<text x="70.0" y="282.0" font-size="11" text-anchor="start" fill="#6b7280">输出</text>
<rect x="110.0" y="265.0" width="180.0" height="30.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="200.0" y="283.3" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600">main（写入的块）</text>
<rect x="350.0" y="90.0" width="260.0" height="70.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="480.0" y="121.8" font-size="13" text-anchor="middle" fill="#134e4a" font-weight="600">Simple Vector Store</text>
<text x="480.0" y="138.7" font-size="11" text-anchor="middle" fill="#6b7280">mode = Get Many</text>
<rect x="350.0" y="200.0" width="82.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="391.0" y="220.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">main</text>
<path d="M391.0,200.0 L391.0,160.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="438.0" y="200.0" width="82.0" height="34.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="479.0" y="220.3" font-size="11" text-anchor="middle" fill="#4c1d95" font-weight="600">Embedding*</text>
<path d="M479.0,200.0 L479.0,160.0" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>
<text x="380.0" y="282.0" font-size="11" text-anchor="start" fill="#6b7280">输出</text>
<rect x="420.0" y="265.0" width="180.0" height="30.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="510.0" y="283.3" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600">main（匹配的块）</text>
<rect x="660.0" y="90.0" width="260.0" height="70.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="790.0" y="121.8" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="600">Simple Vector Store</text>
<text x="790.0" y="138.7" font-size="11" text-anchor="middle" fill="#6b7280">mode = Retrieve as Tool</text>
<rect x="660.0" y="200.0" width="82.0" height="34.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="701.0" y="220.3" font-size="11" text-anchor="middle" fill="#4c1d95" font-weight="600">Embedding*</text>
<path d="M701.0,200.0 L701.0,160.0" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>
<text x="690.0" y="282.0" font-size="11" text-anchor="start" fill="#6b7280">输出</text>
<rect x="730.0" y="265.0" width="180.0" height="30.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="820.0" y="283.3" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600">ai_tool → Agent</text>
<text x="480.0" y="318.0" font-size="11" text-anchor="middle" fill="#6b7280">切换模式时，编辑器重新求值表达式，画布上的端口随之变化</text>
</svg>
