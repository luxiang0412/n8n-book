<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-label="Task Runner：Code 节点不再在主进程里运行代码，而是把代码和数据交给一个子进程；子进程以禁止从字符串生成代码、只带白名单环境变量的方式启动；任务超时、死循环或内存耗尽时，主进程杀掉并重启 runner，自身不受影响。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>Task Runner：Code 节点不再在主进程里运行代码，而是把代码和数据交给一个子进程；子进程以禁止从字符串生成代码、只带白名单环境变量的方式启动；任务超时、死循环或内存耗尽时，主进程杀掉并重启 runner，自身不受影响。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="359" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">Task Runner：把不可信代码关进另一个进程</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">隔离靠进程，不靠 node:vm</text>
<rect x="20.0" y="70.0" width="430.0" height="250.0" rx="12" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="88.0" font-size="12" text-anchor="start" fill="#2563eb" font-weight="600">主进程（main 或 worker）</text>
<rect x="40.0" y="110.0" width="180.0" height="60.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130.0" y="137.1" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600">Code 节点</text>
<text x="130.0" y="152.7" font-size="10" text-anchor="middle" fill="#6b7280">startJob(&#x27;javascript&#x27;)</text>
<rect x="250.0" y="110.0" width="180.0" height="60.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="340.0" y="137.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">TaskRunnerProcess</text>
<text x="340.0" y="152.7" font-size="10" text-anchor="middle" fill="#6b7280">计时 · 重启 · 分派</text>
<rect x="40.0" y="200.0" width="390.0" height="90.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="235.0" y="236.6" font-size="11" text-anchor="middle" fill="#9ca3af" font-weight="600">进程里有的东西</text>
<text x="235.0" y="250.9" font-size="9" text-anchor="middle" fill="#6b7280">加密密钥 · 数据库连接 · 凭证 · 其他执行</text>
<text x="235.0" y="262.6" font-size="9" text-anchor="middle" fill="#6b7280">——代码一个也碰不到</text>
<path d="M220.0,140.0 L250.0,140.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="530.0" y="70.0" width="430.0" height="250.0" rx="12" fill="none" stroke="#0d9488" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="542.0" y="88.0" font-size="12" text-anchor="start" fill="#0d9488" font-weight="600">runner 子进程（fork + IPC）</text>
<rect x="550.0" y="104.0" width="390.0" height="72.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="745.0" y="131.6" font-size="11" text-anchor="middle" fill="#134e4a" font-weight="600" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">node 启动参数</text>
<text x="745.0" y="145.9" font-size="9" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">--disallow-code-generation-from-strings</text>
<text x="745.0" y="157.6" font-size="9" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">--disable-proto=delete</text>
<rect x="550.0" y="190.0" width="180.0" height="50.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="640.0" y="212.4" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600">env 白名单</text>
<text x="640.0" y="226.8" font-size="9" text-anchor="middle" fill="#6b7280">PATH · HOME · TZ</text>
<rect x="760.0" y="190.0" width="180.0" height="50.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="850.0" y="212.4" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600">vm 上下文</text>
<text x="850.0" y="226.8" font-size="9" text-anchor="middle" fill="#6b7280">$input · $json · $(...)</text>
<rect x="550.0" y="255.0" width="390.0" height="45.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="745.0" y="280.8" font-size="11" text-anchor="middle" fill="#78350f" font-weight="600">死循环 / 挂起 / 内存耗尽 → 进程退出或被杀</text>
<path d="M430.0,130.0 L550.0,130.0" fill="none" stroke="#0d9488" stroke-width="1.6" marker-end="url(#a-teal)"/>
<rect x="408.3" y="112.0" width="163.3" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="490.0" y="123.5" font-size="11" text-anchor="middle" fill="#0d9488">broker:task（代码 + 数据）</text>
<path d="M550.0,155.0 L430.0,155.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<rect x="399.9" y="161.0" width="180.3" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="490.0" y="172.5" font-size="11" text-anchor="middle" fill="#16a34a">runner:taskdone / taskerror</text>
<path d="M745.0,300.0 L745.0,336.0 L340.0,336.0 L340.0,170.0" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a-warn)"/>
<rect x="374.2" y="320.0" width="206.7" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="477.5" y="331.5" font-size="11" text-anchor="middle" fill="#d97706">超时：SIGKILL，下一个任务启动新进程</text>
</svg>
